name: Install TRF map pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-map-pack.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the map-pack files
        shell: bash
        run: |
          cat > /tmp/trf-map-pack.b64 <<'B64'
          
          B64
          base64 --decode /tmp/trf-map-pack.b64 > /tmp/trf-map-pack.tar.gz
          tar --extract --gzip --file /tmp/trf-map-pack.tar.gz --directory .
          python -m py_compile scripts/build_map_pack.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps scripts requirements-map.txt
          git commit -m "Install TRF site-planning map pack"
          git push
