name: Build TRF soil map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_soil_map.py"
      - "requirements-map.txt"
      - ".github/workflows/build-soil-map.yml"

permissions:
  contents: write

concurrency:
  group: trf-soil-map-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map.txt

      - name: Install map dependencies
        run: python -m pip install --upgrade pip -r requirements-map.txt

      - name: Build NRCS soil map
        run: python scripts/build_soil_map.py

      - name: Upload soil map as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trf-nrcs-soil-map
          path: |
            maps/generated/10-nrcs-soil-map.png
            maps/generated/soil-build-report.json
          if-no-files-found: error

      - name: Commit refreshed soil map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/generated/10-nrcs-soil-map.png maps/generated/soil-build-report.json
          if git diff --cached --quiet; then
            echo "No generated soil-map changes to commit."
          else
            git commit -m "Refresh TRF NRCS soil map [skip ci]"
            git push
          fi
