<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc">
  <title id="title">Requested campsite footprint for a 2012 Forest River Wildcat 293MK</title>
  <desc id="desc">Scale-controlled plan with the camper oriented north to south, hitch south, entry and canopy west, and three floorplan-derived slides. The conservative RV zone is 31 feet 6 inches by 14 feet 3 inches and the southwest canopy is 15 by 10 feet. Total stepped area is approximately 598.9 square feet.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9ded8" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#333"/>
    </marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#20252a}
      .dim{font-size:16px}
      .small{font-size:14px}
      .tiny{font-size:12px}
      .label{font-size:16px;font-weight:700}
      .slide{fill:#9bc3e6;stroke:#264f73;stroke-width:3}
      .dimension{stroke:#333;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="45" y="46" font-size="27" font-weight="700">Requested campsite footprint — floorplan-matched orientation</text>
  <text x="45" y="73" font-size="15">Drawing scale: 20 px = 1 ft. Planning geometry remains provisional pending field measurements.</text>

  <rect x="45" y="105" width="785" height="730" fill="url(#grid)" stroke="#777"/>

  <!-- Union of the RV planning envelope and southwest canopy: 598.875 sq ft. -->
  <path d="M360 145H645V775H60V575H360Z" fill="#e53935" fill-opacity=".08" stroke="#b00020" stroke-width="4" stroke-dasharray="10 7"/>

  <!-- Conservative RV envelope, not the camper body. -->
  <rect x="360" y="145" width="285" height="630" fill="#d9e8f7" fill-opacity=".48" stroke="#264f73" stroke-width="3"/>
  <text x="502.5" y="166" text-anchor="middle" class="small" font-weight="700">31 ft 6 in × 14 ft 3 in RV PLANNING ZONE</text>

  <!-- Approximate 8 ft closed body, oriented to match the clockwise floorplan. -->
  <path d="M411.7 185V704C411.7 750 443 775 491.7 775S571.7 750 571.7 704V185Z" fill="#f0f2f4" stroke="#303941" stroke-width="4"/>
  <text x="491.7" y="470" text-anchor="middle" class="label" transform="rotate(90 491.7 470)">2012 WILDCAT 293MK — APPROX. 8 FT BODY</text>

  <!-- Three slides positioned on the same sides as the clockwise floorplan. -->
  <rect x="370" y="260" width="41.7" height="155" rx="4" class="slide"/>
  <text x="391" y="338" text-anchor="middle" class="small" transform="rotate(-90 391 338)">KITCHEN SLIDE ≈ 25 IN</text>

  <rect x="571.7" y="250" width="63.3" height="245" rx="4" class="slide"/>
  <text x="603.4" y="372" text-anchor="middle" class="small" transform="rotate(90 603.4 372)">LIVING / DINETTE SLIDE ≈ 38 IN</text>

  <rect x="571.7" y="555" width="48.3" height="135" rx="4" class="slide"/>
  <text x="595.9" y="622" text-anchor="middle" class="small" transform="rotate(90 595.9 622)">BEDROOM SLIDE ≈ 29 IN</text>

  <!-- Fifth-wheel nose and hitch direction. -->
  <path d="M491.7 775V806M477 806H506.4" fill="none" stroke="#303941" stroke-width="4"/>
  <path d="M491.7 822L480 802H503.4Z" fill="#303941"/>
  <text x="520" y="813" class="small" font-weight="700">HITCH / FRONT — SOUTH</text>

  <!-- Canopy sits west of the southwest portion, matching the site geometry. -->
  <rect x="60" y="575" width="300" height="200" fill="#ffe3a8" fill-opacity=".9" stroke="#a56200" stroke-width="4"/>
  <text x="210" y="662" text-anchor="middle" font-size="23" font-weight="700">15 × 10 FT CANOPY</text>
  <text x="210" y="690" text-anchor="middle" class="small">WEST / SOUTHWEST OF CAMPER</text>
  <text x="210" y="714" text-anchor="middle" class="tiny">Away from adjacent road</text>

  <!-- West-side entry and stairs, drawn above the canopy for legibility. -->
  <path d="M411.7 607V660" fill="none" stroke="#a56200" stroke-width="6"/>
  <path d="M411.7 612H391M411.7 628H383M411.7 644H375" fill="none" stroke="#a56200" stroke-width="4"/>
  <text x="370" y="595" class="small" font-weight="700" fill="#7b4900">ENTRY + STEPS</text>

  <!-- Road and orientation. -->
  <rect x="710" y="105" width="90" height="730" fill="#e6dfcc" stroke="#8a7b5f" stroke-width="2"/>
  <path d="M755 120V820" stroke="#fff" stroke-width="5" stroke-dasharray="20 18"/>
  <text x="786" y="470" text-anchor="middle" font-size="17" font-weight="700" transform="rotate(90 786 470)">EAST — ADJACENT ACCESS ROAD</text>
  <path d="M815 190V125" stroke="#20252a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="815" y="214" text-anchor="middle" class="label">NORTH</text>

  <!-- Dimensions. -->
  <line x1="360" y1="120" x2="645" y2="120" class="dimension"/>
  <text x="502.5" y="113" text-anchor="middle" class="dim">14 ft 3 in conservative deployed width</text>

  <line x1="672" y1="145" x2="672" y2="775" class="dimension"/>
  <text x="691" y="460" text-anchor="middle" class="dim" transform="rotate(90 691 460)">31 ft 6 in overall length</text>

  <line x1="60" y1="858" x2="360" y2="858" class="dimension"/>
  <text x="210" y="884" text-anchor="middle" class="dim">15 ft canopy projection west</text>

  <line x1="30" y1="575" x2="30" y2="775" class="dimension"/>
  <text x="14" y="675" text-anchor="middle" class="dim" transform="rotate(-90 14 675)">10 ft canopy length</text>

  <!-- Notes and source reconciliation. -->
  <g transform="translate(840 130)">
    <text class="label">FLOORPLAN MATCH</text>
    <text y="30" class="small">• Nose / hitch faces south</text>
    <text y="55" class="small">• Entry and steps face west</text>
    <text y="80" class="small">• Kitchen slide faces west</text>
    <text y="105" class="small">• Living and bedroom slides face east</text>
    <text y="130" class="small">• Road is east of the camper</text>

    <text y="185" class="label">SCALE-DERIVED SLIDES</text>
    <text y="215" class="small">Kitchen: approximately 25 in</text>
    <text y="240" class="small">Living / dinette: approximately 38 in</text>
    <text y="265" class="small">Bedroom: approximately 29 in</text>
    <text y="290" class="tiny">Allow approximately ±2 in; field verify.</text>

    <text y="345" class="label">AREA</text>
    <text y="375" class="small">RV zone: 448.875 sq ft</text>
    <text y="400" class="small">Canopy: 150.000 sq ft</text>
    <text y="425" class="small" font-weight="700">Stepped total: 598.875 sq ft</text>

    <text y="480" class="label">IMPORTANT</text>
    <text y="510" class="tiny">The blue rectangle is a planning envelope,</text>
    <text y="530" class="tiny">not the literal camper outline. Verify body,</text>
    <text y="550" class="tiny">slides, steps, hitch, stabilizers, canopy</text>
    <text y="570" class="tiny">anchors, setbacks, trees, grade, and site</text>
    <text y="590" class="tiny">anchor before final placement or submission.</text>
  </g>

  <text x="45" y="928" class="tiny">Floorplan reference: floorplans/2012-wildcat-293mk-floorplan-clockwise.webp. Slide depths are scale-derived; the 14 ft 3 in zone remains the current conservative site-planning value.</text>
</svg>
