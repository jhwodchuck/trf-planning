<text x="1195" y="182" class="small">• Positions are provisional.</text>
<text x="1195" y="206" class="small">• Each colored polygon = 600 sq ft.</text>
<text x="1195" y="230" class="small">• Two-pass households may remain split.</text>
<text x="1195" y="254" class="small">• Compactness is intentionally not a goal.</text>
<text x="1195" y="278" class="small">• Known structures are drawn to scale.</text>
<text x="1195" y="302" class="small">• Dashed structures require dimensions.</text>
<text x="1195" y="326" class="small">• Road/setbacks follow supplied controls.</text>
<text x="1195" y="350" class="small">• Field verification is still required.</text>
