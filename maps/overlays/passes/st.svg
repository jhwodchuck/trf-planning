<svg xmlns="http://www.w3.org/2000/svg" width="208" height="1136" viewBox="0 0 208 1136" role="img" aria-labelledby="title desc">
<title id="title">S. + T. — 600 sq ft pass</title>
<desc id="desc">Standalone provisional pass drawing, decomposed from the public group-site planning overlay.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#151515}
.title{font-size:15px;font-weight:700}.sub{font-size:9px}
.label{font-size:11px;font-weight:700}.small{font-size:9px}.tiny{font-size:8px}
.pass{stroke:#222;stroke-width:2;fill-opacity:.28}
.eq{stroke-width:2;fill-opacity:.5;stroke:#333}
.placeholder{stroke-width:2;stroke-dasharray:6 4;fill-opacity:.2;stroke:#333}
.clearance{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:5 4}
</style></defs>
<polygon points="8.0,8.0 200.0,8.0 200.0,360.0 136.0,360.0 136.0,840.0 200.0,840.0 200.0,1128.0 8.0,1128.0 8.0,840.0 72.0,840.0 72.0,360.0 8.0,360.0" class="pass" fill="#b4a7d6"/>
<polygon points="16.0,16.0 192.0,16.0 192.0,352.0 16.0,352.0" class="clearance" aria-label="Primary tent provisional clearance zone"/>
<polygon points="24.0,24.0 184.0,24.0 184.0,344.0 24.0,344.0" class="eq" fill="#8e7cc3"/>
<text x="104.0" y="179.0" text-anchor="middle" class="tiny">Primary tent</text>
<text x="104.0" y="192.0" text-anchor="middle" class="tiny">10 x 20 ft</text>
<polygon points="48.0,992.0 160.0,992.0 160.0,1104.0 48.0,1104.0" class="clearance" aria-label="Handicap Portapotty provisional clearance zone"/>
<polygon points="56.0,1000.0 152.0,1000.0 152.0,1096.0 56.0,1096.0" class="eq" fill="#674ea7"/>
<text x="104.0" y="1043.0" text-anchor="middle" class="tiny">Handicap Portapotty</text>
<text x="104.0" y="1056.0" text-anchor="middle" class="tiny">6 x 6 ft ADA</text>
<text x="104.0" y="600.0" text-anchor="middle" class="tiny">4 x 30 ft connector path</text>
<text x="104.0" y="866.0" text-anchor="middle" class="label">S. + T.</text>
<text x="104.0" y="884.0" text-anchor="middle" class="small">600 sq ft</text>
<text x="104.0" y="896.0" text-anchor="middle" class="tiny">264 + 120 + 216 = 600 sq ft</text>
</svg>
