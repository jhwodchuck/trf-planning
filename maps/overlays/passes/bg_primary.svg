<svg xmlns="http://www.w3.org/2000/svg" width="736" height="496" viewBox="0 0 736 496" role="img" aria-labelledby="title desc">
<title id="title">B. + G. — Pass A / Two Tents — 600 sq ft pass</title>
<desc id="desc">Standalone provisional pass drawing, decomposed from the public group-site planning overlay.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#151515}
.title{font-size:15px;font-weight:700}.sub{font-size:9px}
.label{font-size:11px;font-weight:700}.small{font-size:9px}.tiny{font-size:8px}
.pass{stroke:#222;stroke-width:2;fill-opacity:.28}
.eq{stroke-width:2;fill-opacity:.5;stroke:#333}
.placeholder{stroke-width:2;stroke-dasharray:6 4;fill-opacity:.2;stroke:#333}
.clearance{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:5 4}
</style></defs>
<polygon points="8.0,8.0 440.0,8.0 440.0,312.0 728.0,312.0 728.0,488.0 392.0,488.0 392.0,216.0 8.0,216.0" class="pass" fill="#c27ba0"/>
<polygon points="8.0,0.0 440.0,0.0 440.0,224.0 8.0,224.0" class="clearance" aria-label="Primary tent provisional clearance zone"/>
<polygon points="16.0,8.0 432.0,8.0 432.0,216.0 16.0,216.0" class="eq" fill="#a64d79"/>
<text x="224.0" y="107.0" text-anchor="middle" class="tiny">Primary tent</text>
<text x="224.0" y="120.0" text-anchor="middle" class="tiny">26 x 13 ft (rotated)</text>
<polygon points="392.0,312.0 728.0,312.0 728.0,488.0 392.0,488.0" class="clearance" aria-label="Closet tent provisional clearance zone"/>
<polygon points="400.0,320.0 720.0,320.0 720.0,480.0 400.0,480.0" class="placeholder" fill="#c27ba0"/>
<text x="560.0" y="395.0" text-anchor="middle" class="tiny">Closet tent</text>
<text x="560.0" y="408.0" text-anchor="middle" class="tiny">approx. 20 x 10 ft (rotated)</text>
<polygon points="400.0,224.0 432.0,224.0 432.0,256.0 400.0,256.0" class="placeholder" fill="#cc0000"/>
<text x="416.0" y="235.0" text-anchor="middle" class="tiny">G1</text>
<polygon points="400.0,272.0 432.0,272.0 432.0,304.0 400.0,304.0" class="placeholder" fill="#cc0000"/>
<text x="416.0" y="283.0" text-anchor="middle" class="tiny">G2</text>
<text x="224.0" y="178.0" text-anchor="middle" class="label">B. + G. — Pass A / Two Tents</text>
<text x="224.0" y="196.0" text-anchor="middle" class="small">600 sq ft</text>
<text x="224.0" y="208.0" text-anchor="middle" class="tiny">538 sq ft nominal tents; only 62 sq ft remains for all clearance and access</text>
